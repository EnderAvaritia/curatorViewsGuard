# Steam 鉴赏家浏览量预测与受控提升系统配置文件
# 使用方法：`python cli.py init-config` 生成本模板，或手动复制后修改。
# 相对路径均相对于本文件所在目录解析。

# ── 基础配置 ──────────────────────────────────────────────────────────────

# Steam 鉴赏家组 ID（纯数字，如 45519015），必填
clan_id: ""

# 存放 Steam 登录 Cookie 的文本文件路径（相对本文件所在目录）
cookie_file: "cookie.txt"

# 代理地址（可选），如 http://127.0.0.1:10279；留空表示不使用代理
proxy: ""

# SQLite 数据库文件路径（相对本文件所在目录），存放每日统计与提升日志
db_path: "views.db"

# ── 通知配置（可选，两者都配置才启用 ntfy 推送，否则仅写日志） ──────────

# ntfy 服务地址，如 https://ntfy.sh
ntfy_url: ""

# ntfy 主题名，如 steam-curator-views
ntfy_topic: ""

# 是否启用每日受控提升；命令行 --no-boost 可临时关闭
boost_enabled: true

# 执行器子进程命令（可选，调度器/执行器分离）。
# 支持占位符: {config} 配置文件路径, {need} 目标刷量, {apps} 推荐数量。
# 留空则在同一进程内直接调用 Booster（向后兼容）。
# 示例: python cli.py boost --config {config} --target {need} --apps {apps}
executor_cmd: ""

# ── 预测参数 ──────────────────────────────────────────────────────────────

# 中位数计算窗口（天数）
window_days: 14

# 趋势斜率相对中位数的封顶比例，防止极端值影响（0~1）
trend_cap: 0.15

# 启动阶段（数据不足一个窗口）的保守系数，低于 1 以抑制误判
startup_factor: 0.9

# 计算趋势所需的最少数据点数
trend_min_points: 5

# ── 反作弊（异常溢出检测）参数 ────────────────────────────────────────────

# 异常判定阈值：实际浏览量超过 expected * (1 + k) 视为候选异常日
outlier_k: 0.30

# 连续候选达到该天数才标记为恶意刷量
consecutive_days: 2

# 溢出量分摊到未来多少天（吸收期），用于平滑浏览曲线
absorb_days: 3

# ── 受控提升参数 ──────────────────────────────────────────────────────────

# 每日提升使用的最近推荐数量
boost_n: 5

# 单个游戏单日成功访问次数上限
single_cap: 300

# 每批处理的游戏数量
batch_size: 50

# 累计提升达到目标值的该比例后提前停止（仅 boost_distribution: ratio 模式生效），
# 避免超额制造尖峰
target_ratio: 0.95

# 提升分配方式（可切换）：
#   ratio（默认）= 累计达到目标 target_ratio 比例后提前停止，宁可略欠不超额；
#   exact        = 按推荐条数精确分配配额，恰好刷满目标，不多不少
#                  （如目标 500、推荐 30 条 → 前 20 条各 17 次 + 后 10 条各 16 次，
#                  即 30×16+20）
boost_distribution: "ratio"

# 今日目标浏览量的上下界（单位：次；0 表示该方向不设界）。
# 只夹取“今日目标”（基准 × 目标系数），刷量缺口仍 = 目标 − 昨日自然流量：
#   target_max > 0 = 上限，防止 growth 模式目标随天无限上涨（增长不收敛）；
#   target_min > 0 = 下限，目标跌破下限时按下限补量，防止浏览量一路下滑。
# 两者为 0 时不设界。刷量列表与手动 boost 的显式数值不受此限制。
# run / daemon 实际执行时按夹取后的目标下发刷量，forecast 只是同口径预览；
# target_max 同时是最终刷量的硬上限，波动率也不会突破它。
target_min: 0
target_max: 0

# ── 网络与运行参数 ────────────────────────────────────────────────────────

# 并发线程数（<=1 为顺序执行，推荐保持 1 以精确计数）
threads: 1

# 两次请求之间的随机等待区间（秒），用于模拟自然访问节奏
wait_min: 8.0
wait_max: 16.0

# 连续请求失败达到该次数后中止本轮任务
max_retries: 3
